releaseNotes: |+
  ## [1.9.66]

  ### Features

  - 通讯录新增「部门」视图：可在字母视图与部门视图之间切换，按部门树查看成员及人数，展开部门时才加载成员，大团队下打开更快。
  - 周期任务生成新任务时，会自动与原任务建立关联，方便追溯每一次周期任务。
  - 建立或解除任务关联时，会在双方任务的动态中留下记录，关联变化一目了然。

  ### Bug Fixes

  - 修复取消任务关联时提示失败（404）的问题，现在可以正常解除关联。
  - 修复个别带批注的 Word 文档导致文件同步中断、后续文件无法被搜索到的问题。

  ### Security

  - 加固通讯录成员搜索，修复按部门筛选时存在的安全隐患。

  ## [1.9.59]

  ### Features

  - 管理员可在网页上直接在线更新服务端：设置菜单与头像下拉新增「系统更新」入口，更新前需再次输入登录密码，并可查看实时进度、日志与结果；更新前会自动备份数据库，如有本地修改会中止以保护数据。
  - 工作报告、日历、我的收藏、最近打开、签到打卡等内置功能改由「系统功能」应用统一管理，可按需开启或关闭，关闭后入口会同步从应用中心、头像菜单和左侧导航中隐藏。
  - 项目页筛选支持多选组合：可同时按状态（含未计划）、标签、负责人筛选，并显示已选数量，支持一键清空；看板、列表、甘特图的筛选结果保持一致。
  - 项目列表模式下，分组选择下拉会显示各分组的任务数量。
  - 仪表盘视图切换合并为「列表｜四象限｜部门总览」，切换更直观。
  - 插件菜单支持自定义抽屉默认宽度，满足不同插件的展示需要。
  - AI 助手悬浮按钮的显示开关迁移到「应用 → AI 助手 → 个人偏好」中设置。
  - 客户端更新相关提示文案更清晰：统一标明「客户端」，更新按钮统一为「立即更新」。

  ### Bug Fixes

  - 修复自定义天数的周期任务到点后不断重复生成任务的问题，周期任务现在会按设定正常生成。
  - 修复桌面客户端在新标签页中打开分享文件（如 Excel 预览）时，提示「请登录后继续」或「身份已失效」的问题。
  - 修复项目列表模式下，「我的任务」中已有添加任务入口时仍误显示「暂无任务」的问题。
  - 修复搜索服务重启或暂时不可用时，AI 相关索引可能重复全量同步的问题。
  - 修复任务编辑器高度、成员选择器间距，并去除菜单项键盘聚焦时多余的边框与阴影，界面更整洁。

  ## [1.9.36]

  ### Features

  - 新增任务流转与部门指派：管理员开启后，可查看负责人交接及任务状态变化记录，指派负责人时附带留言；支持配置部门负责人和部门管理员的指派范围。
  - 仪表盘焕新，个人任务列表与四象限展示更清晰，并适配深色主题；团队优先级以环形图展示，点击即可筛选对应任务。
  - 项目表格支持按到期、排期、逾期和未排期等分组选择显示内容，并记住各项目的选择；筛选菜单支持鼠标悬停展开。
  - 登录页支持自定义 Logo 和系统名称，网页、桌面端与移动端统一展示配置的品牌。
  - 项目设置改为右侧抽屉，窄屏下全屏展示，保存和取消按钮固定在底部，长表单操作更方便。
  - 创建任务时支持右键取消已选负责人和协助人员；人员选择弹窗支持通过头像关闭按钮或退格键取消选择，并改善触屏操作与部门列表布局。
  - 支持由部署管理员单独隐藏移动 APP 的 AI 相关入口，不影响网页和桌面端使用。

  ### Bug Fixes

  - 修复未领取任务缺少指定负责人入口的问题，有权限的成员可通过任务详情的「添加」菜单设置负责人。
  - 修复项目列表新增任务时出现空白行的问题。
  - 修复知识库读取权限不足可能影响 AI 助手使用产品及应用知识的问题。
  - 优化任务详情头部高度、流转记录加载图标及项目归档菜单分组，改善页面显示与操作体验。

  ## [1.9.18]

  ### Features

  - 新增 WebDAV 文件访问：可在 Finder、资源管理器等客户端中管理「我的文件」和「共享文件」；管理员可控制使用范围，成员可单独创建、撤销和清理设备应用密码。
  - 文件页新增「协作文件」，集中查看会话、项目群聊和任务中的文件与图片，支持按来源、类型和发送人筛选；桌面客户端还可显示下载状态，并直接在本地文件夹中定位文件。
  - AI 助手新增悬浮按钮显示开关，可按当前设备隐藏浮球，同时保留快捷键和其他 AI 入口。
  - 系统设置重新整理分组与标签页，常用配置更容易查找；部门负责人视角默认开启，团队任务查看更方便。

  ### Bug Fixes

  - 关闭注册后会同步隐藏登录页注册入口，并完善关闭状态提示和登录切换动画，避免用户进入不可用的注册流程。
  - 修复已失效成员导致群聊人数显示变化的问题。
  - 修复系统设置中列模板、任务优先级输入框可能被意外清空的问题，并改善编辑体验。
  - 修复协作文件筛选栏、列表内容及文件页部分操作在窄屏下溢出或对齐不整齐的问题。
  - 延长在线授权请求等待时间，降低网络较慢时的失败概率。
  - 修复项目目录和静态文件权限异常可能导致安装、构建或网页资源访问失败的问题。
  - 优化仪表盘警告提示、移动端角标的位置与显示效果。

  ### Performance

  - 优化协作文件索引与缓存，减少重复加载，在文件较多时筛选和切换更流畅。

  ## [1.8.89]

  ### Features

  - 管理后台仪表盘新增负责人视角，可按部门查看团队任务；个人视角的待办、逾期、今日和即将到期任务展示也更清晰。
  - 语义搜索升级为更智能的自动向量检索，搜索相关内容更准确，内容更新后会自动保持索引同步。
  - 撤回聊天文字或 Markdown 消息后支持「重新编辑」，可在有效期内恢复原内容继续修改。
  - 微应用加载失败时会显示清晰的错误提示，并提供重试和关闭入口。
  - 「我的文件」现在包含已共享文件，切换板块时优先展示缓存内容，查找文件更顺畅。

  ### Bug Fixes

  - 修复 AI 助手模型隐藏设置未完全生效的问题，正在使用的模型被隐藏时会自动切换到可用模型。
  - 修复仪表盘待完成分组默认展开状态不一致的问题。
  - 修复撤回消息、文件切换及部分网络异常场景下的显示和状态同步问题。

  ### Performance

  - 优化仪表盘移动端布局与任务分组样式，减少页面拥挤，浏览和操作更顺手。

